name: Documentation
on:
  push:
    branches: [main]
    paths: ['docs/**', 'scripts/check-docs.py', 'scripts/pages-redirects.py', '.github/workflows/pages.yml']
  pull_request:
    paths: ['docs/**', 'scripts/check-docs.py', 'scripts/pages-redirects.py', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check that every page is rendered
        run: |
          missing=0
          for source in docs/*.qmd; do
            page="${source%.qmd}.html"
            if [ ! -f "$page" ]; then
              echo "::error file=$source::$page is missing. Run 'quarto render docs', then 'rsync -a --exclude .DS_Store docs/_site/ docs/' to publish the render beside the sources. The render step removes the published copies, so the rsync is not optional."
              missing=1
            fi
          done
          exit "$missing"
      - name: Check documentation links
        run: python3 scripts/check-docs.py docs
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Write redirects to phpstats.org
        run: python3 scripts/pages-redirects.py docs _pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _pages
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v4
