name: Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - run: composer validate --strict
      - run: composer lint
      - run: composer test
  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cmdstan: ['2.37.0', '2.40.0']
    env:
      CMDSTAN: ${{ github.workspace }}/.context/cmdstan/cmdstan-${{ matrix.cmdstan }}
      CMDSTAN_RELEASE: ${{ matrix.cmdstan }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ffi
          coverage: none
          tools: composer:v2, php-config, phpize
      - run: composer install --no-interaction --prefer-dist
      - name: Check out posterior-draw kernels
        uses: actions/checkout@v4
        with:
          repository: phpstats/phit
          ref: bb9133ea39245977f0b79f77d168c7d4e9bdd107
          path: .context/phit
          persist-credentials: false
      - name: Install matching PHP headers and clang
        run: |
          sudo apt-get update
          # One LLVM for bindgen: its libclang must match the clang headers it parses (the runner image also carries a newer LLVM).
          sudo apt-get install -y clang-18 libclang-18-dev
          test "$(php-config --version | cut -d. -f1,2)" = "$(php -r 'echo PHP_MAJOR_VERSION, ".", PHP_MINOR_VERSION;')"
          {
            echo "PHP_CONFIG=$(command -v php-config)"
            echo "PHP=$(command -v php)"
            echo "LIBCLANG_PATH=/usr/lib/llvm-18/lib"
            echo "CLANG_PATH=/usr/bin/clang-18"
            echo "BINDGEN_EXTRA_CLANG_ARGS=-resource-dir=$(clang-18 -print-resource-dir)"
            echo "PHIT_LIBRARY=$PWD/.context/phit/target/release/libphit.so"
          } >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
      - name: Build and verify phit
        run: |
          cargo build --manifest-path .context/phit/Cargo.toml --package phit --release --locked
          php -d extension="$PHIT_LIBRARY" -r 'require "vendor/autoload.php"; CmdStan\DrawKernels::require(); if (!extension_loaded("ffi") || !function_exists("Phit\\dist_normal_rng") || !function_exists("Phit\\model_matrix") || !function_exists("Phit\\fit_lmer")) { throw new RuntimeException("FFI, seeded native draws, Phit\\model_matrix, and Phit\\fit_lmer are required by CI"); }'
      - name: Test native kernels, moment matching, and model matrices
        run: php -d extension="$PHIT_LIBRARY" vendor/bin/phpunit --filter '(DrawKernelsTest|MomentMatchTest|StanDataTest::testRealModelMatrix)' --exclude-group integration --exclude-group compatibility --fail-on-skipped
      - uses: actions/cache@v4
        id: cmdstan-cache
        with:
          path: .context/cmdstan
          key: cmdstan-${{ runner.os }}-${{ runner.arch }}-${{ matrix.cmdstan }}-v1
      - name: Install and build CmdStan
        if: steps.cmdstan-cache.outputs.cache-hit != 'true'
        run: php -r 'require "vendor/autoload.php"; CmdStan\install_cmdstan(getenv("CMDSTAN_RELEASE"), ".context/cmdstan", 2, 1800);'
      - name: Test real CmdStan models
        run: php -d extension="$PHIT_LIBRARY" vendor/bin/phpunit --group integration --exclude-group compatibility --fail-on-skipped
      - name: Render figures with vl-convert
        run: |
          mkdir -p .context/vl-convert
          curl --fail --location --proto =https --output .context/vl-convert/vl.zip https://github.com/vega/vl-convert/releases/download/v1.9.0/vl-convert_linux-64.zip
          unzip -q .context/vl-convert/vl.zip -d .context/vl-convert
          VL_CONVERT="$PWD/.context/vl-convert/bin/vl-convert" php -d extension="$PHIT_LIBRARY" vendor/bin/phpunit --filter VlConvert tests/PlotTest.php --fail-on-skipped
      - uses: r-lib/actions/setup-r@v2
        if: matrix.cmdstan == '2.40.0'
        with:
          use-public-rspm: true
      - name: Install reference R packages
        if: matrix.cmdstan == '2.40.0'
        # CmdStanR 1.0 (release candidate) from its v1.0 branch, pinned; its dependencies come from r-universe and CRAN.
        run: |
          Rscript -e 'install.packages(c("cmdstanr", "posterior", "loo", "bayesplot", "jsonlite", "Rcpp", "RcppEigen", "data.table"), repos = c("https://stan-dev.r-universe.dev", "https://cloud.r-project.org"))'
          curl --fail --location --retry 3 --proto =https --output .context/cmdstanr.tar.gz https://github.com/stan-dev/cmdstanr/archive/0a541236d0a5ada0ecc544ecb6aa1715e808de78.tar.gz
          R CMD INSTALL .context/cmdstanr.tar.gz
          Rscript -e 'stopifnot(packageVersion("cmdstanr") >= "0.99.0", packageVersion("data.table") >= "1.18.0")'
      - name: Compare with CmdStanR
        if: matrix.cmdstan == '2.40.0'
        run: php -d extension="$PHIT_LIBRARY" vendor/bin/phpunit --group compatibility --fail-on-skipped
