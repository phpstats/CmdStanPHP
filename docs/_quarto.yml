project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"

website:
  site-url: "https://cmdstanphp.phpstats.org/docs"
  title: "CmdStanPHP"
  repo-url: "https://github.com/phpstats/CmdStanPHP"
  sidebar:
    style: docked
    search: true
    contents:
      - section: "Getting started"
        contents:
          - text: "Overview"
            href: index.qmd
          - installation.qmd
          - getting-started.qmd
      - section: "Guides"
        contents:
          - compiling.qmd
          - mcmc.qmd
          - optimization.qmd
          - variational.qmd
          - generated-quantities.qmd
          - draws.qmd
          - log-density.qmd
          - loo.qmd
          - figures.qmd
          - compatibility.qmd
      - section: "Functions and methods"
        contents:
          - api.qmd
          - api-functions.qmd
          - api-options.qmd
          - api-models.qmd
          - api-fits.qmd
          - api-data-frames.qmd
          - api-helpers.qmd
          - api-errors.qmd
      - section: "Examples"
        contents:
          - examples/sample.qmd
          - examples.qmd
      - section: "Contributing"
        contents:
          - contributing.qmd

format:
  html:
    theme: cosmo
    toc: true
    code-copy: true
    highlight-style: github
