project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"

website:
  site-url: "https://cmdstanphp.phpstats.org/docs"
  title: "CmdStanPHP"
  repo-url: "https://github.com/phpstats/CmdStanPHP"
  sidebar:
    style: docked
    search: true
    contents:
      - text: "Overview"
        href: index.qmd
      - section: "Getting started"
        contents:
          - installation.qmd
          - getting-started.qmd
      - section: "Guides"
        contents:
          - compiling.qmd
          - mcmc.qmd
          - optimization.qmd
          - variational.qmd
          - generated-quantities.qmd
          - draws.qmd
          - log-density.qmd
          - loo.qmd
          - figures.qmd
      - section: "Reference"
        contents:
          - api.qmd
      - section: "Examples"
        contents:
          - examples.qmd
      - section: "Compatibility and limitations"
        contents:
          - compatibility.qmd
      - section: "Benchmarks and verification"
        contents:
          - verification.qmd
      - section: "Contributing"
        contents:
          - contributing.qmd

format:
  html:
    theme: cosmo
    toc: true
    code-copy: true
    highlight-style: github
